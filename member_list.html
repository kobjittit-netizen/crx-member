<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็ครายชื่อสมาชิก CRX</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 28px;
        }
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            border-color: #3498db;
        }
        .stats {
            margin-bottom: 15px;
            font-weight: bold;
            color: #7f8c8d;
            font-size: 15px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        
        /* ไฮไลท์ตำแหน่งพิเศษ */
        .rank-president { background-color: #e8f4fd !important; font-weight: bold; }
        .rank-vice { background-color: #eafaf1 !important; font-weight: bold; }
        .rank-secretary { background-color: #fef9e7 !important; font-weight: bold; }
        
        .no-result {
            text-align: center;
            padding: 30px;
            color: #e74c3c;
            display: none;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📋 ระบบเช็ครายชื่อสมาชิก CRX</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="filterMembers()" placeholder="🔍 พิมพ์เพื่อค้นหาด้วย ชื่อเล่น หรือ Username ทันที...">
    </div>

    <div class="stats" id="memberCount">กำลังโหลดข้อมูลสมาชิก...</div>

    <div class="table-responsive">
        <table id="memberTable">
            <thead>
                <tr>
                    <th style="width: 15%; text-align: center;">ลำดับ</th>
                    <th style="width: 42%;">Username</th>
                    <th style="width: 43%;">ชื่อเล่น</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
        <div id="noResult" class="no-result">❌ ไม่พบรายชื่อสมาชิกที่คุณค้นหา</div>
    </div>
</div>

    // โหลดข้อมูลใส่ในตารางเมื่อเปิดเว็บ
    function initTable() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        members.forEach(m => {
            let row = `<tr class="${m.class}">
                <td style="text-align: center;">${m.id}</td>
                <td>${m.username}</td>
                <td>${m.nickname}</td>
            </tr>`;
            tableBody.innerHTML += row;
        });
        
        updateTotalCount(members.length);
    }

    // อัปเดตตัวเลขจำนวนคนที่แสดงอยู่
    function updateTotalCount(count) {
        document.getElementById('memberCount').innerText = `พบสมาชิกทั้งหมด ${count} คน`;
    }

    // ฟังก์ชันค้นหารายชื่อแบบ Real-time
    function filterMembers() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toLowerCase().trim();
        const table = document.getElementById('memberTable');
        const tr = table.getElementsByTagName('tr');
        let count = 0;

        for (let i = 1; i < tr.length; i++) {
            let tdUser = tr[i].getElementsByTagName('td')[1];
            let tdNick = tr[i].getElementsByTagName('td')[2];
            
            if (tdUser || tdNick) {
                let userText = tdUser.textContent || tdUser.innerText;
                let nickText = tdNick.textContent || tdNick.innerText;
                
                if (userText.toLowerCase().includes(filter) || nickText.toLowerCase().includes(filter)) {
                    tr[i].style.display = "";
                    count++;
                } else {
                    tr[i].style.display = "none";
                }
            }
        }

        updateTotalCount(count);
        
        // แสดงข้อความเมื่อค้นหาไม่เจอใครเลย
        const noResult = document.getElementById('noResult');
        noResult.style.display = (count === 0) ? "block" : "none";
    }

    // เรียกใช้งานฟังก์ชันเมื่อหน้าเว็บโหลดเสร็จ
    window.onload = initTable;
</script>
